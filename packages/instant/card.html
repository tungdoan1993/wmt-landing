<article class="pkg-card pkg-{{v:color}} {{v:featured}}">
  <span class="pkg-kind">{{t:kind}}</span>
  <span class="pkg-size num">{{v:size}}</span>
  <span class="pkg-price"><strong class="num">{{v:price}}</strong><s class="list num">{{v:list}}</s><span>{{t:oneTime}}</span></span>
  <ul class="pkg-points">{{list:points|point.html}}</ul>
  <a class="btn pkg-cta" href="{{reg:@place}}" data-cta="register" data-place="{{v:place}}">{{t:get}} <bdi class="num">{{v:size}}</bdi></a>
</article>

name: Content check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node core/validate.mjs
      - run: node core/build.mjs
      - run: MARKET=iran node core/build.mjs
      - run: MARKET=ethiopia node core/build.mjs

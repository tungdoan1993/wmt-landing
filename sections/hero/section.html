<section class="hero">
  <div class="wrap hero-row">
    <div class="hero-copy">
      <span class="eyebrow">{{t:eyebrow}}</span>
      <h1><span>{{t:title1}}</span> <span>{{t:title2}}</span></h1>
      <p class="hero-sub">{{t:subtitle}}</p>
      <div class="hero-cta">
        <a class="btn btn-tg btn-lg btn-pulse" href="{{tg:hero}}" data-cta="telegram" data-place="hero">{{icon:telegram}}{{t:ctaTelegram}}</a>
        <span class="small">{{t:ctaNote}}</span>
        <a class="hero-reg" href="{{reg:hero}}" data-cta="register" data-place="hero">{{t:ctaRegister}}</a>
      </div>
    </div>
    <figure class="hero-video">
      {{video}}
      <figcaption><span>{{t:videoCaption}}</span><strong class="num">{{v:videoAmount}}</strong></figcaption>
    </figure>
  </div>
</section>

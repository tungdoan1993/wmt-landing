<section class="section tg-section" id="telegram">
  <div class="wrap tg-box">
    <div class="tg-copy">
      <span class="tg-eyebrow">{{icon:telegram}}{{t:eyebrow}}</span>
      <h2>{{t:title}}</h2>
      <ul class="tg-list">{{list:items|item.html}}</ul>
      <a class="btn btn-tg btn-lg" href="{{tg:telegram_section}}" data-cta="telegram" data-place="telegram_section">{{icon:telegram}}{{t:cta}}</a>
      <span class="small">{{t:note}}</span>
    </div>
    <div class="tg-chat" aria-hidden="true">
      <div class="chat-head"><img src="{{asset:logo.png}}" alt="" width="68" height="32"><span>WeMasterTrade<small>bot</small></span></div>
      <div class="chat-body">
        <p class="bubble bot">{{t:chat1}}</p>
        <p class="bubble me">{{t:chat2}}</p>
        <p class="bubble bot">{{t:chat3}}</p>
        <span class="chat-btn">{{t:chat4}}</span>
      </div>
    </div>
  </div>
</section>

<div class="popup" id="popup" hidden>
  <div class="popup-box" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <button type="button" class="popup-close" aria-label="{{a:close}}">{{icon:close}}</button>
    <span class="popup-badge">{{icon:gift}}{{t:badge}}</span>
    <h2 id="popup-title">{{t:title}}</h2>
    <p>{{t:text}}</p>
    <a class="btn btn-tg btn-lg" href="{{tg:popup}}" data-cta="telegram" data-place="popup">{{icon:telegram}}{{t:cta}}</a>
    <a class="popup-alt" href="{{reg:popup}}" data-cta="register" data-place="popup">{{t:alt}}</a>
    <span class="small">{{t:note}}</span>
  </div>
</div>
